[project]
name = "boilerroomsimulator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "black>=26.5.1",
    "django>=6.0.6",
]

[project.optional-dependencies]
graphs = [
    "pyqtgraph>=0.13",
    "PySide6>=6.6",
]
test = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
